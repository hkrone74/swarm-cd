# Fork hkrone74/swarm-cd (Redmine #93). Nur für die GitLab-Spiegelung; oben gilt
# .github/workflows. Getestet wird jeder Push, gebaut nur ein Tag `v<upstream>-ssk.<n>`:
# das Abbild bekommt genau diese Marke und kein `latest` (ADR 0002, Abschnitt 5 — swarm-cd
# ist Plattform und läuft mit fester Version).

stages:
  - test
  - package

test-job:
  stage: test
  image: golang:1.22-alpine
  script:
    - go vet ./swarmcd/ ./util/ ./web/ ./cmd/
    - go test ./...

build-job:
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-ssk\.[0-9]+$/'
  image: docker
  services:
    - name: docker:dind
      command: ["--insecure-registry=registry.ssk.internal"]
  variables:
    IMAGE_TAG: registry.ssk.internal/$CI_PROJECT_NAME:$CI_COMMIT_TAG
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --pull -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
