# Fork hkrone74/swarm-cd (Redmine #93). Nur für die GitLab-Spiegelung; oben gilt
# .github/workflows. Getestet wird jeder Push, gebaut nur ein Tag `v<upstream>-ssk.<n>`:
# das Abbild bekommt genau diese Marke und kein `latest` (ADR 0002, Abschnitt 5 — swarm-cd
# ist Plattform und läuft mit fester Version).

# Runner-Zuordnung wie im Template hkrone74/ci (ADR 0003 in infrastruktur, Redmine #127):
# geschuetzte Refs auf `geschuetzt`, alles andere auf `allgemein`. Die Build-Tags `v*-ssk.*`
# sind in GitLab als protected tags eingetragen und bauen deshalb auf `geschuetzt`.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      variables: { RUNNER_TAG: geschuetzt }
    - when: always
      variables: { RUNNER_TAG: allgemein }

default:
  tags: [$RUNNER_TAG]

stages:
  - test
  - package

test-job:
  stage: test
  image: golang:1.22-alpine
  script:
    - go vet ./swarmcd/ ./util/ ./web/ ./cmd/
    - go test ./...

build-job:
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-ssk\.[0-9]+$/'
  # kaniko statt dind: baut ohne Docker-Daemon und ohne privileged. Dieselbe Version wie
  # `.bauen` im Template hkrone74/ci; bei einem Wechsel dort hier mitziehen.
  image:
    name: martizih/kaniko:v1.28.5-debug@sha256:d6d74217dc077acfd3094992e917c357080a2d3fdd1042a49e34e29a7e57c572
    entrypoint: [""]
  variables:
    IMAGE_TAG: registry.ssk.internal/$CI_PROJECT_NAME:$CI_COMMIT_TAG
  script:
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --insecure-registry registry.ssk.internal
        --destination "$IMAGE_TAG"
