# SwarmCD configuration file refernce

# The interval in seconds that SwarmCD
# waits everytime before pulling
update_interval: 120

# The amount of parallel threads for deploying stacks.
# The sensible value depends on the setup to prevent
# the swarm manager from overloading.
# NOTE: stacks on the same repo are NOT parallelized.
concurrency: 3

# The path where SwarmCD will checkout repos
repos_path: repos/

# Automatically detect secrets to decrypt with SOPS
sops_secrets_discovery: true

# Automatically rotate configs and secrets
# when the change. Adds a hash to config
# and secret names
auto_rotate: true

# Whether to always pull container images when deploying stacks.
# When set to true (default), SwarmCD uses `--resolve-image always`
# which always queries the registry for images
# and pulls new images if the SHA has changed.
# When set to false, SwarmCD uses `--resolve-image changed`
# which only pulls images when you change the tag in the stack file.
# This is a global default that can be overridden per-stack.
always_pull_containers: true

# Only run `docker stack deploy` when the stack would change.
# SwarmCD hashes the compose file as it would be deployed (after
# template rendering and config/secret rotation, so config and
# secret contents count) together with the deploy options, and
# skips the deploy when the hash equals the last successful one.
# A commit that does not touch a stack does not redeploy it.
# NOTE: drift is no longer corrected. A service changed or removed
# by hand stays that way until its stack file changes.
deploy_only_on_change: false

# File to persist the last deployed hash per stack. Without it the
# state is kept in memory, and a restart deploys every stack once.
# A missing or corrupt file is not fatal; it has the same effect.
state_file: /data/state.json

# You can define repos here instead of
# defining a separate repos.yaml file
repos:

# You can define stacks here instead of
# defining a separate stacks.yaml file
stacks:

# The WEB UI address
address: 0.0.0.0:8080
